# Surface Duo (2026-11-20): location from the modem's own GNSS only (ModemManager gps-nmea; duo-gps-assist warms it
# with time + XTRA). No Wi-Fi / 3G lookups (they send the nearby networks to a third-party web service), no LAN NMEA.
# Apps need a geoclue agent in the session: Plasma Mobile has none of its own, the geoclue-2.0 package's demo agent
# (/etc/xdg/autostart/geoclue-demo-agent.desktop, NotShowIn=GNOME) runs in Plasma. With an agent registered, geoclue
# 2.7 lets every non-sandboxed app in and asks the agent (a notification) only for Flatpak apps.
[network-nmea]
enable=false

[3g]
enable=false

[cdma]
enable=false

[wifi]
enable=false
submit-data=false

# enabled on purpose, with no /etc/geolocation file: when both the Wi-Fi and the static source are off, geoclue falls
# back to a GeoIP web lookup (seen on the phone: "ipf fallback (from GeoIP data)"). This keeps that off.
[static-source]
enable=true

[modem-gps]
enable=true

[compass]
enable=true
