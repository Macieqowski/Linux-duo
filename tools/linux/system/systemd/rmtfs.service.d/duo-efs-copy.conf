# Surface Duo: rmtfs serves Linux's own copy of the modem's EFS (/var/lib/duo-efs, made once from the partitions,
# which are never written) so the modem's EFS settings persist under Linux without touching Android's. See duo-rmtfs.
[Service]
ExecStart=
ExecStart=/usr/libexec/duo/duo-rmtfs
